name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Electron sandbox helper
        run: |
          if [ ! -f node_modules/electron/dist/chrome-sandbox ]; then
            node node_modules/electron/install.js
          fi
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libatk-bridge2.0-0 libgbm1 libgtk-3-0 libnss3

      - name: Run check
        run: npm run check

      - name: Run coverage
        run: npm run test:coverage

      - name: Smoke deck load performance snapshot
        run: xvfb-run -a npm run perf:snapshot -- --scenario deck-load --wait-ms 1000

  performance-smoke:
    name: Manual Performance Smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - deck-play
          - deck-record
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Electron sandbox helper
        run: |
          if [ ! -f node_modules/electron/dist/chrome-sandbox ]; then
            node node_modules/electron/install.js
          fi
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libatk-bridge2.0-0 libgbm1 libgtk-3-0 libnss3

      - name: Run performance smoke
        run: xvfb-run -a npm run perf:snapshot -- --scenario ${{ matrix.scenario }} --wait-ms 3000
