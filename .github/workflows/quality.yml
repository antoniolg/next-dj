name: Reusable Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Configure Electron sandbox helper
        run: |
          if [ ! -f node_modules/electron/dist/chrome-sandbox ]; then
            node node_modules/electron/install.js
          fi
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libatk-bridge2.0-0 libgbm1 libgtk-3-0 libnss3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Electron end-to-end smoke
        run: xvfb-run -a npm run test:e2e:run -- --out artifacts/e2e/report.json

      - name: Production performance gate
        run: >-
          xvfb-run -a node scripts/run-performance-gate.mjs
          --scenario deck-load
          --repetitions 3
          --warmup-ms 1000
          --wait-ms 500
          --out artifacts/performance/deck-load.json

      - name: Upload quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            artifacts/
            coverage/
          if-no-files-found: warn
          retention-days: 14
